services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/db/app.db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    # -B runs an embedded Celery beat scheduler alongside the worker so
    # retention cleanup / stale-job reaping run without a 5th container.
    # Concurrency defaults to 1: each concurrent transcription loads its own
    # copy of the Whisper model, and two at once can get OOM-killed on a
    # memory-capped Docker Desktop. CELERY_CONCURRENCY is still honored as
    # an alias for existing .env files.
    command: celery -A app.celery_app worker -B --loglevel=info --concurrency=${TRANSCRIPTION_CONCURRENCY:-${CELERY_CONCURRENCY:-1}}
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/db/app.db
      - REDIS_URL=redis://redis:6379/0
      # Keep the Whisper weights on a named volume so `up --build` never
      # re-downloads the ~460MB model (only `down -v` clears it).
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}
    volumes:
      - app_data:/data
      - whisper_cache:/root/.cache/huggingface
      # Optional cookies.txt for yt-dlp (see secrets/README.md); mounted
      # read-only so it can be dropped in/updated without a rebuild.
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${NEXT_PUBLIC_MAX_UPLOAD_MB:-${MAX_UPLOAD_MB:-61440}}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - NEXT_PUBLIC_MAX_UPLOAD_MB=${NEXT_PUBLIC_MAX_UPLOAD_MB:-${MAX_UPLOAD_MB:-61440}}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  app_data:
  redis_data:
  # Whisper/HuggingFace model weights. Survives `docker compose up --build`
  # and `down`; only `down -v` forces a re-download.
  whisper_cache:
