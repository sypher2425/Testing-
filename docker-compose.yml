services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/db/app.db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    # -B runs an embedded Celery beat scheduler alongside the worker so
    # retention cleanup / stale-job reaping run without a 5th container.
    command: celery -A app.celery_app worker -B --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/db/app.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app_data:/data
      # Optional cookies.txt for yt-dlp (see secrets/README.md); mounted
      # read-only so it can be dropped in/updated without a rebuild.
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  app_data:
  redis_data:
